<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ error_code }} - {{ error_title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #f9fafb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container { text-align: center; padding: 0 1rem; }
        .error-code {
            font-size: 4.5rem;
            font-weight: 700;
            color: #111827;
            margin-bottom: 0.5rem;
            line-height: 1;
        }
        .error-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: #374151;
            margin-bottom: 1rem;
        }
        .error-message {
            color: #4b5563;
            max-width: 28rem;
            margin: 0 auto;
            line-height: 1.5;
        }
        @media (prefers-color-scheme: dark) {
            body { background-color: #111827; }
            .error-code { color: #f9fafb; }
            .error-title { color: #d1d5db; }
            .error-message { color: #9ca3af; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="error-code">{{ error_code }}</h1>
        <h2 class="error-title">{{ error_title }}</h2>
        <p class="error-message">{{ error_message }}</p>
        {% if config.DEBUG and error_detail %}
        <p style="color:#6b7280;font-size:0.8rem;max-width:36rem;margin:1rem auto 0;font-family:monospace;word-break:break-word;">{{ error_detail }}</p>
        {% endif %}
    </div>
</body>
</html>
